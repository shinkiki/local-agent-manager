[package]
name = "agent-manager-tauri"
version = "0.1.0"
description = "Cross-platform local AI agent session manager"
authors = ["shinkiki"]
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/shinkiki/local-agent-manager"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_manager_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
agent-manager-core = { path = "../crates/agent-manager-core" }
serde = { version = "1", features = ["derive"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
