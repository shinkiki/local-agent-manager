name: Release (Windows)

# Windows 설치본은 macOS 로컬 릴리스 절차(release-agent-manager 스킬)와 별개로
# 여기서 만든다. 서명 자격증명이 저장소 시크릿에 있으면 서명하고, 없으면
# 미서명으로 빌드해 아티팩트만 남긴다. 자격증명은 나중에 붙여도 되도록
# 파이프라인이 두 경우 모두를 지원한다.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload-to-release:
        description: "빌드 결과를 같은 이름의 GitHub Release에 올린다"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      # 태그 빌드는 만들어진 설치본을 Release에 올린다.
      contents: write
    env:
      AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
      AZURE_KEY_VAULT_CERTIFICATE: ${{ secrets.AZURE_KEY_VAULT_CERTIFICATE }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve signing mode
        id: signing
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_KEY_VAULT_URL)) {
            "config-arg=" >> $env:GITHUB_OUTPUT
            "signed=false" >> $env:GITHUB_OUTPUT
            Write-Host "서명 시크릿이 없어 미서명으로 빌드합니다."
          }
          else {
            "config-arg=--config src-tauri/tauri.windows-signing.conf.json" >> $env:GITHUB_OUTPUT
            "signed=true" >> $env:GITHUB_OUTPUT
            Write-Host "Key Vault 서명을 사용합니다."
          }

      - name: Install AzureSignTool
        if: steps.signing.outputs.signed == 'true'
        run: dotnet tool install --global AzureSignTool

      - name: Build Windows bundles
        shell: pwsh
        env:
          AGENT_MANAGER_WINDOWS_SIGN_SCRIPT: ${{ github.workspace }}\scripts\windows\sign-windows-binary.ps1
        run: npm run tauri -- build --bundles nsis,msi ${{ steps.signing.outputs.config-arg }}

      - name: Verify signature
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $bundles = Get-ChildItem -Path 'target/release/bundle' -Recurse -Include '*.exe', '*.msi'
          if (-not $bundles) { throw '검사할 설치본을 찾지 못했습니다.' }
          foreach ($bundle in $bundles) {
            $signature = Get-AuthenticodeSignature -FilePath $bundle.FullName
            Write-Host "$($bundle.Name): $($signature.Status) / $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') {
              throw "서명이 유효하지 않습니다: $($bundle.Name) ($($signature.Status))"
            }
          }

      - name: Report artifact hashes
        shell: pwsh
        run: |
          Get-ChildItem -Path 'target/release/bundle' -Recurse -Include '*.exe', '*.msi' |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash, $_.Name }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-manager-windows-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.upload-to-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -Path 'target/release/bundle' -Recurse -Include '*.exe', '*.msi' |
            ForEach-Object { $_.FullName }
          gh release upload $env:GITHUB_REF_NAME @assets --clobber
